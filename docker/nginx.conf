# Public site: static PWA from public/, API and everything else through PHP-FPM.

# Real visitor IP. Trust X-Forwarded-For only from private networks (the Docker network, a reverse
# proxy or tunnel on the same host/LAN). Add your proxy's address here if it is somewhere else.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# https when a TLS-terminating proxy in front says so.
map $http_x_forwarded_proto $app_https {
    default off;
    https   on;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.html index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # No hashed file names, so always revalidate (cheap 304s); the service worker must never be stale.
    location ~* \.(?:html|css|js|json|webmanifest)$ {
        expires -1;
        try_files $uri =404;
    }
    location ~* \.(?:png|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    location ~ ^/index\.php(?:/|$) {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param HTTPS $app_https;
        fastcgi_read_timeout 60s;
        # nginx already sends these (above); avoid duplicates from Laravel.
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Permissions-Policy;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve other PHP files or hidden files.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { return 404; }
}
